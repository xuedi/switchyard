# switchyard's page for one app. data/token and data/ca.crt from the dashboard's Secret:
#   kubectl -n shop get secret shop-dashboard-token -o jsonpath='{.data.token}'  | base64 -d > data/token
#   kubectl -n shop get secret shop-dashboard-token -o jsonpath='{.data.ca\.crt}' | base64 -d > data/ca.crt
name: switchyard

services:
  app:
    image: ghcr.io/xuedi/switchyard:latest
    container_name: switchyard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080/tcp"   # loopback: put an authenticating proxy in front, there is no login
    environment:
      TZ: Europe/Berlin
      SWITCHYARD_API: https://192.168.1.10:6443
      SWITCHYARD_NAMESPACE: shop
      SWITCHYARD_STATE: shop-release
      SWITCHYARD_TITLE: Shop staging
      SWITCHYARD_LINKS: site=https://shop.example.org
    volumes:
      - ./data:/data:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]

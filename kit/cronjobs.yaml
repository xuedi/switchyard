# The deploy, quick and rollback Jobs. The CronJobs are suspended and never run on a schedule:
# they are templates the dashboard (or a person) starts a Job from:
#   kubectl -n {{.Namespace}} create job --from=cronjob/{{.Prefix}}deploy {{.Prefix}}deploy-$(date +%s)
#   kubectl -n {{.Namespace}} create job --from=cronjob/{{.Prefix}}rollback {{.Prefix}}rollback-r7-$(date +%s)
{{- range .Kinds}}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{q (print $.Prefix .)}}
  namespace: {{q $.Namespace}}
  labels: {app.kubernetes.io/part-of: {{q $.App}}}
spec:
  suspend: true
  schedule: "0 0 31 2 *"
  jobTemplate:
    metadata:
      labels: {app.kubernetes.io/part-of: {{q $.App}}, {{q $.JobLabelKey}}: {{q $.JobLabelValue}}}
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: {app.kubernetes.io/part-of: {{q $.App}}, {{q $.JobLabelKey}}: {{q $.JobLabelValue}}}
        spec:
          serviceAccountName: {{q $.JobAccount}}
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsUser: {{$.UID}}
            runAsGroup: {{$.GID}}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: switchyard
              image: {{q $.Image}}
              imagePullPolicy: {{$.PullPolicy}}
{{- if $.TZ}}
              env: [{name: TZ, value: {{q $.TZ}}}]
{{- end}}
              command: [bash, /switchyard/switchyard.sh, {{.}}]
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: switchyard, mountPath: /switchyard, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: switchyard, configMap: {name: {{q $.Scripts}}}}
            - {name: tmp, emptyDir: {}}
{{- end}}

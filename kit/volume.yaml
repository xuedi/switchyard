# The releases volume: one directory r<n> per release, built by the build Job. Slots and
# followers mount theirs with subPath. ReadWriteOnce is enough on one node; across nodes it
# needs a volume many pods can mount (ReadWriteMany).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{q .ReleasesPVC}}
  namespace: {{q .Namespace}}
  labels: {app.kubernetes.io/part-of: {{q .App}}}
spec:
  accessModes: [{{.AccessMode}}]
{{- if .StorageClass}}
  storageClassName: {{q .StorageClass}}
{{- end}}
  resources: {requests: {storage: {{q .ReleasesSize}}}}
---
# The state: written by switchyard.sh, read by the dashboard. Applying this again keeps its data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{q .State}}
  namespace: {{q .Namespace}}
  labels: {app.kubernetes.io/part-of: {{q .App}}}

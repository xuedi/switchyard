# switchyard.sh runs as {{.App}}-switchyard: it scales and points the slots, points the followers,
# starts build Jobs, reads their logs and writes the state.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{q .JobAccount}}
  namespace: {{q .Namespace}}
  labels: {app.kubernetes.io/part-of: {{q .App}}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{q .JobAccount}}
  namespace: {{q .Namespace}}
  labels: {app.kubernetes.io/part-of: {{q .App}}}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{list .Deployments}}]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [{{q .SlotA}}, {{q .SlotB}}]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create]
{{- if .CronJobFollowers}}
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [{{list .CronJobFollowers}}]
    verbs: [get, patch]
{{- end}}
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{q .State}}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{q .JobAccount}}
  namespace: {{q .Namespace}}
  labels: {app.kubernetes.io/part-of: {{q .App}}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{q .JobAccount}}}
subjects: [{kind: ServiceAccount, name: {{q .JobAccount}}, namespace: {{q .Namespace}}}]
{{- if .RouterConfigMap}}
---
# The router's config, and nothing else in its namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{q .RouterRole}}
  namespace: {{q .RouterNamespace}}
  labels: {app.kubernetes.io/part-of: {{q .App}}}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{q .RouterConfigMap}}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{q .RouterRole}}
  namespace: {{q .RouterNamespace}}
  labels: {app.kubernetes.io/part-of: {{q .App}}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{q .RouterRole}}}
subjects: [{kind: ServiceAccount, name: {{q .JobAccount}}, namespace: {{q .Namespace}}}]
{{- end}}
---
# The dashboard's token. It may read the state, the three CronJobs, the Jobs, pods and their
# logs, and create Jobs; the admission policy (policy.yaml) lets those be nothing but an
# unchanged copy of one of the CronJobs. No exec, Secrets, delete, scale, or other namespaces.
#   kubectl -n {{.Namespace}} get secret {{.DashboardAccount}}-token -o jsonpath='{.data.token}'  | base64 -d > data/token
#   kubectl -n {{.Namespace}} get secret {{.DashboardAccount}}-token -o jsonpath='{.data.ca\.crt}' | base64 -d > data/ca.crt
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{q .DashboardAccount}}
  namespace: {{q .Namespace}}
  labels: {app.kubernetes.io/part-of: {{q .App}}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: {{q (print .DashboardAccount "-token")}}
  namespace: {{q .Namespace}}
  labels: {app.kubernetes.io/part-of: {{q .App}}}
  annotations:
    kubernetes.io/service-account.name: {{q .DashboardAccount}}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{q .DashboardAccount}}
  namespace: {{q .Namespace}}
  labels: {app.kubernetes.io/part-of: {{q .App}}}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{q .State}}]
    verbs: [get]
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [{{list .CronJobs}}]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [list, create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{q .DashboardAccount}}
  namespace: {{q .Namespace}}
  labels: {app.kubernetes.io/part-of: {{q .App}}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{q .DashboardAccount}}}
subjects: [{kind: ServiceAccount, name: {{q .DashboardAccount}}, namespace: {{q .Namespace}}}]

# The build Job on one release, filled in by switchyard.sh: @NAME@ a unique name, @MODE@ build
# or after-rollback, @RELEASE@ the release (r<n>), @FROM@ the release to copy first, @KEEP@ the
# releases whose directories stay (all others are removed before the build), @ALLOW@ 1 to let
# destructive migrations through.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: @NAME@
  namespace: {{q .Namespace}}
  labels: {app.kubernetes.io/part-of: {{q .App}}, app.kubernetes.io/component: build, switchyard/release: "@RELEASE@"}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: {{q .App}}, app.kubernetes.io/component: build, switchyard/release: "@RELEASE@"}
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsUser: {{.UID}}
        runAsGroup: {{.GID}}
        fsGroup: {{.GID}}
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # the release's directory has to exist before it can be mounted with subPath, and be made
        # by the app's user: one the kubelet creates would be root's
        - name: mkdir
          image: {{q .BuildImage}}
          imagePullPolicy: {{.PullPolicy}}
          command: [mkdir, -p, /releases/@RELEASE@]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: releases, mountPath: /releases}
      containers:
        - name: build
          image: {{q .BuildImage}}
          imagePullPolicy: {{.PullPolicy}}
          command: [bash, /switchyard/switchyard.sh, "@MODE@"]
{{- if .BuildEnvFrom}}
          envFrom:
{{- range .BuildEnvFrom}}
            - {{.Kind}}Ref: {name: {{q .Name}}}
{{- end}}
{{- end}}
          env:
{{- range .BuildEnv}}
            - {name: {{q .Name}}, value: {{q .Value}}}
{{- end}}
{{- if .TZ}}
            - {name: TZ, value: {{q .TZ}}}
{{- end}}
            - {name: RELEASE, value: "@RELEASE@"}
            - {name: COPY_FROM, value: "@FROM@"}
            - {name: KEEP_RELEASES, value: "@KEEP@"}
            - {name: ALLOW_DESTRUCTIVE, value: "@ALLOW@"}
          resources:
            requests: {cpu: {{q .BuildCPU}}, memory: 256Mi}
            limits: {memory: {{q .BuildMemory}}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: releases, mountPath: {{q .BuildMount}}, subPath: "@RELEASE@"}
            - {name: releases, mountPath: /releases}
            - {name: tmp, mountPath: /tmp}
            - {name: switchyard, mountPath: /switchyard, readOnly: true}
{{- range $i, $m := .BuildMounts}}
            - {name: mount-{{$i}}, mountPath: {{q $m.Path}}, readOnly: true}
{{- end}}
      volumes:
        - {name: releases, persistentVolumeClaim: {claimName: {{q .ReleasesPVC}}}}
        - {name: tmp, emptyDir: {}}
        - {name: switchyard, configMap: {name: {{q .Scripts}}}}
{{- range $i, $m := .BuildMounts}}
{{- if eq $m.Kind "secret"}}
        - {name: mount-{{$i}}, secret: {secretName: {{q $m.Name}}, defaultMode: 0440}}
{{- else}}
        - {name: mount-{{$i}}, configMap: {name: {{q $m.Name}}}}
{{- end}}
{{- end}}

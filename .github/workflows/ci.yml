name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # No go.sum to key a cache on: the project has no dependencies.
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - run: go vet ./...

      # ubuntu's awk is mawk, the one Debian-based app images have
      - run: go test ./...

      - name: the SQL checker under busybox awk too
        run: |
          docker run --rm -v "$PWD/kit:/k:ro" busybox:1.37 awk -f /k/check-sql.awk /k/testdata/pending.sql > out.txt || true
          diff out.txt kit/testdata/pending.out

      - name: shellcheck
        run: shellcheck -s bash kit/*.sh kit/router/*.sh examples/*/hooks/*

      - name: cross-compile
        run: |
          for t in linux/amd64 linux/arm64 linux/arm linux/riscv64; do
            echo "$t"
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 go build -o /dev/null .
          done

  # On a version tag (v0.5.0, ...): a multi-arch image to ghcr.io/xuedi/switchyard.
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/xuedi/switchyard:${{ github.ref_name }}
            ghcr.io/xuedi/switchyard:latest

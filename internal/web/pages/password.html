<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>switchyard password</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="narrow">
  <h1><a href="./"><img src="logo.svg" alt="switchyard"></a> switchyard <small>password</small></h1>
  <form class="card" method="post" action="password">
    <div id="old" class="err" hidden>The current password is wrong.</div>
    <div id="locked" class="err" hidden>Too many failed tries from here: try again in 15 minutes.</div>
    <div id="new" class="err" hidden>The new password needs 8 or more characters, twice the same.</div>
    <div id="changed" class="ok-box" hidden>Changed. Every other session is logged out.</div>
    <input name="user" autocomplete="username" hidden>
    <label for="cur">Current password</label>
    <input id="cur" name="old" type="password" autocomplete="current-password" required>
    <label for="pw">New password (8 or more)</label>
    <input id="pw" name="new" type="password" autocomplete="new-password" minlength="8" required>
    <label for="again">New password again</label>
    <input id="again" name="again" type="password" autocomplete="new-password" minlength="8" required>
    <div class="buttons" style="margin-top:14px"><button>Change it</button><span class="muted">Logs out every other session.</span></div>
  </form>
  <form class="card" method="post" action="logout/all">
    <div class="buttons"><button class="stop">Log out everywhere</button><span class="muted">Ends every session, this one too.</span></div>
  </form>
</main>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("old").hidden = q.get("failed") !== "old";
document.getElementById("locked").hidden = q.get("failed") !== "locked";
document.getElementById("new").hidden = q.get("failed") !== "new";
document.getElementById("changed").hidden = !q.has("changed");
</script>
</body>
</html>

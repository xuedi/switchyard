# The app's own part: the two slots, their Services, and a scheduler that follows the live
# release. switchyard renders the rest. Each slot mounts the volume shop-releases as "code";
# switchyard.sh sets its subPath to the release it runs, so r0 here is only a placeholder (after
# applying this file again: kubectl -n shop create job --from=cronjob/deploy deploy-reapply-$(date +%s)).
---
apiVersion: v1
kind: Service
metadata: {name: shop-a, namespace: shop}
spec:
  selector: {app.kubernetes.io/name: shop, switchyard/slot: a}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: shop-b, namespace: shop}
spec:
  selector: {app.kubernetes.io/name: shop, switchyard/slot: b}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-a, namespace: shop}
spec:
  replicas: 0                    # set by switchyard.sh
  selector: {matchLabels: {app.kubernetes.io/name: shop, switchyard/slot: a}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: shop, switchyard/slot: a}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true}
      containers:
        - name: web
          image: ghcr.io/example/shop-base:1
          envFrom: [{configMapRef: {name: shop-env}}, {secretRef: {name: shop}}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
          volumeMounts:
            - {name: code, mountPath: /app, subPath: r0}
      volumes:
        - {name: code, persistentVolumeClaim: {claimName: shop-releases}}
---
# shop-b: the same with "b" for "a"
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-b, namespace: shop}
spec:
  replicas: 0
  selector: {matchLabels: {app.kubernetes.io/name: shop, switchyard/slot: b}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: shop, switchyard/slot: b}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true}
      containers:
        - name: web
          image: ghcr.io/example/shop-base:1
          envFrom: [{configMapRef: {name: shop-env}}, {secretRef: {name: shop}}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
          volumeMounts:
            - {name: code, mountPath: /app, subPath: r0}
      volumes:
        - {name: code, persistentVolumeClaim: {claimName: shop-releases}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: shop-cron, namespace: shop}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true}
          containers:
            - name: cron
              image: ghcr.io/example/shop-base:1
              command: [php, bin/console, app:cron]
              envFrom: [{configMapRef: {name: shop-env}}, {secretRef: {name: shop}}]
              volumeMounts:
                - {name: code, mountPath: /app, subPath: r0}
          volumes:
            - {name: code, persistentVolumeClaim: {claimName: shop-releases}}
